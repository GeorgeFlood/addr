<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PostcodeFindr</title>

    <!-- Hanken Grotesk: clean, modern, not the overused Inter/Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/img/favicon16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/img/favicon32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="/img/favicon48x48.png"
    />
    <link rel="icon" href="/img/logo.png" />

    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <main>
      <div class="stage">
        <img class="logo" src="img/logo.png" />
        <h1>PostcodeFind<span style="color: #fa5e62">r</span></h1>
        <p class="tagline">Type a UK postcode. Get the address.</p>

        <div class="search" id="search">
          <label for="postcode" hidden>Postcode</label>
          <input
            type="text"
            id="postcode"
            name="postcode"
            inputmode="text"
            autocomplete="postal-code"
            spellcheck="false"
            placeholder="e.g. SW15 1AA"
          />
          <button class="find" id="find" type="button">Find</button>
        </div>
        <div class="result" id="result" role="region" aria-live="polite"></div>

        <div class="additional">
          <h3>Coming soon:</h3>
          <ul class="feature-list">
            <li class="list-item">Chrome Extension</li>
            <li class="list-item">CLI Download</li>
          </ul>
        </div>
      </div>
    </main>

    <footer>©<span id="date"></span> PostcodeFindr</footer>
  </body>
  <script src="script.js"></script>
</html>
